<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luluclc3 File Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;font-family:system-ui,sans-serif}.frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:5;background:transparent;opacity:0;transition:opacity 1s}.frame.ready{opacity:1}.vip{position:fixed!important;left:50%!important;right:auto!important;top:18px!important;transform:translateX(-50%)!important;z-index:2147483647!important;border:1px solid #8060c7;background:linear-gradient(135deg,#21143fdd,#101a28dd);backdrop-filter:blur(14px);color:#f5efff;border-radius:15px;padding:12px 24px;font-weight:900;cursor:pointer;box-shadow:0 12px 40px #0009;animation:vip 3s ease-in-out infinite}.vip.on{background:linear-gradient(100deg,#9b7cff,#63e6ff);color:#08090d;border-color:transparent}@keyframes vip{50%{box-shadow:0 0 38px #7f6aff77}}.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,#30205b,transparent 32%),radial-gradient(circle at 85% 25%,#063f4d,transparent 30%),#05060a}.orb{position:absolute;width:38vw;height:38vw;border-radius:50%;filter:blur(70px);opacity:.3;animation:float 16s ease-in-out infinite}.o1{background:#8c62ff;left:-10%;top:-15%}.o2{background:#26d8ee;right:-12%;top:15%;animation-delay:-5s}@keyframes float{50%{transform:translate(8vw,5vh) scale(1.15)}}.boot{position:fixed;inset:0;z-index:2147483649;background:#05060a;display:grid;place-items:center;transition:.8s}.boot.hide{opacity:0;visibility:hidden}.bootbox{text-align:center}.logo{width:78px;height:78px;margin:auto;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#9b7cff,#63e6ff);font-size:32px;font-weight:900}.bootbar{width:260px;height:4px;background:#151923;margin:18px auto}.bootbar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#9b7cff,#63e6ff);animation:load 2.6s forwards}@keyframes load{to{width:100%}}.modal{position:fixed;inset:0;z-index:2147483648;background:#000b;backdrop-filter:blur(18px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:.35s}.modal.open{opacity:1;visibility:visible}.box{width:min(450px,calc(100% - 30px));background:#10131d;border:1px solid #7659b5;border-radius:25px;padding:30px;box-shadow:0 40px 120px #000}.close{float:right;background:none;border:0;color:#aaa;font-size:28px}.box input{width:100%;padding:13px;box-sizing:border-box;background:#080a0f;color:#fff;border:1px solid #363d4c;border-radius:11px}.unlock{width:100%;margin-top:11px;padding:14px;border:0;border-radius:12px;font-weight:900;background:linear-gradient(100deg,#9b7cff,#63e6ff)}.err{text-align:center;color:#ff7d91;font-size:10px;min-height:17px}.premium{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.p{padding:11px;border-radius:11px;background:#090b10;border:1px solid #292e3a;color:#d7dbe3;font-size:10px}.target{display:none}</style></head><body><div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div><div class="boot" id="boot"><div class="bootbox"><div class="logo">L</div><h2 style="color:#fff">Luluclc3 File Studio</h2><p style="color:#8e96a5">Chargement du Studio…</p><div class="bootbar"><i></i></div></div></div><iframe id="studio" class="frame" src="studio-fixed.html"></iframe><button id="vipBtn" class="vip">✦ VIP</button><div id="modal" class="modal"><div class="box"><button id="close" class="close">×</button><div style="color:#a995e0;font-size:10px;letter-spacing:.15em;font-weight:900">ACCÈS VIP</div><h2 style="color:#fff">Ultra, contrôle total.</h2><p style="color:#9299a8;font-size:12px">Déverrouille les options avancées.</p><label style="color:#c3c8d1;font-size:11px">Code VIP</label><input id="code" type="password" placeholder="Entre ton code VIP"><button id="unlock" class="unlock">Activer le VIP ✦</button><div id="err" class="err"></div><div class="premium"><div class="p">⚡ Ultra</div><div class="p">🎯 Taille cible</div><div class="p">🎬 Réglages média</div><div class="p">📦 Traitement par lots</div></div></div></div><script>'use strict';const f=document.getElementById('studio'),b=document.getElementById('boot'),vb=document.getElementById('vipBtn'),m=document.getElementById('modal'),c=document.getElementById('code'),e=document.getElementById('err');let vip=false;try{vip=sessionStorage.getItem('luluclc3_vip')==='1'}catch(x){}const open=()=>{m.classList.add('open');setTimeout(()=>c.focus(),100)},close=()=>m.classList.remove('open');function animateQuality(v){const d=f.contentDocument,q=d&&d.getElementById('quality');if(!q)return;const s=+q.value,end=+v,t=performance.now();q.style.filter='drop-shadow(0 0 8px #9b7cff)';function go(n){const p=Math.min(1,(n-t)/520),e=1-Math.pow(1-p,3);q.value=Math.round(s+(end-s)*e);q.dispatchEvent(new Event('input',{bubbles:true}));if(p<1)requestAnimationFrame(go);else setTimeout(()=>q.style.filter='',180)}requestAnimationFrame(go)}function presets(){const d=f.contentDocument;if(!d?.body||!d?.head)return;const q=d.getElementById('quality');if(!q||d.getElementById('lulu-presets'))return;const st=d.createElement('style');st.textContent='.lulu-presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.lulu-p{flex:1;min-width:70px;border:1px solid #303746;background:#0c1018;color:#dce1e9;border-radius:9px;padding:8px;font:800 10px system-ui;cursor:pointer;transition:.2s}.lulu-p:hover{transform:translateY(-2px);border-color:#7b62b8}.lulu-p.active{background:linear-gradient(100deg,#2a2048,#12303a);border-color:#9b7cff;color:#fff}.lulu-p.lulu-vip-preset{border-color:#63e6ff}.lulu-custom{display:none;gap:7px;margin-top:8px}.lulu-custom.show{display:flex}.lulu-custom input{flex:1;min-width:0;padding:8px;border-radius:9px;background:#080a0f;color:#fff;border:1px solid #343b49}.lulu-custom button{border:0;border-radius:9px;padding:8px 11px;background:linear-gradient(100deg,#9b7cff,#63e6ff);font-weight:900}',d.head.appendChild(st);const wrap=d.createElement('div');wrap.id='lulu-presets';wrap.className='lulu-presets';[['Petit',45],['Moyen',65],['Grand',85]].forEach(([n,v])=>{const x=d.createElement('button');x.className='lulu-p';x.textContent=n;x.onclick=()=>{d.querySelectorAll('.lulu-p').forEach(y=>y.classList.remove('active'));x.classList.add('active');const z=d.getElementById('lulu-custom');if(z)z.classList.remove('show');animateQuality(v)};wrap.appendChild(x)});const vipb=d.createElement('button');vipb.className='lulu-p lulu-vip-preset';vipb.textContent='Personnalisé VIP';vipb.onclick=()=>{if(!vip){open();return}d.getElementById('lulu-custom').classList.toggle('show')};wrap.appendChild(vipb);q.parentNode.appendChild(wrap);const custom=d.createElement('div');custom.id='lulu-custom';custom.className='lulu-custom';const inp=d.createElement('input');inp.type='number';inp.min=10;inp.max=100;inp.value=q.value;inp.placeholder='Qualité 10–100 %';const apply=d.createElement('button');apply.textContent='Appliquer';apply.onclick=()=>animateQuality(Math.max(10,Math.min(100,+inp.value||85)));custom.append(inp,apply);q.parentNode.appendChild(custom)}function inject(){try{const d=f.contentDocument;if(!d?.body)return;f.classList.add('ready');presets();let old=d.getElementById('lulu-vip-overlay');if(old)old.remove();const q=d.createElement('button');q.id='lulu-vip-overlay';q.textContent=vip?'✦ VIP actif':'✦ VIP';q.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:2147483647;padding:12px 24px;border-radius:15px;border:1px solid #8060c7;background:linear-gradient(135deg,#21143fee,#101a28ee);color:#fff;font:900 13px system-ui;cursor:pointer';q.onclick=open;d.body.appendChild(q);if(vip)activate()}catch(x){}}function activate(){vb.textContent='✦ VIP actif';vb.classList.add('on');try{const d=f.contentDocument,q=d?.getElementById('quality');if(q){q.value=100;q.dispatchEvent(new Event('input',{bubbles:true))}const v=d?.getElementById('lulu-vip-overlay');if(v){v.textContent='✦ VIP actif';v.style.background='linear-gradient(100deg,#9b7cff,#63e6ff)';v.style.color='#08090d'}}catch(x){}}vb.onclick=open;document.getElementById('close').onclick=close;m.onclick=x=>{if(x.target===m)close()};document.getElementById('unlock').onclick=()=>{if(c.value.trim()!=='luluclc3'){e.textContent='Code incorrect.';return}vip=true;try{sessionStorage.setItem('luluclc3_vip','1')}catch(x){}inject();activate();close()};c.onkeydown=x=>{if(x.key==='Enter')document.getElementById('unlock').click()};f.onload=inject;setTimeout(()=>{b.classList.add('hide');inject()},2800);if(vip)setTimeout(activate,3000);</script></body></html>
