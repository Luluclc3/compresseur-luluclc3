overflow:hidden}.lulu-bg:before,.lulu-bg:after{content:"";position:absolute;width:45vw;height:45vw;border-radius:50%;filter:blur(80px);opacity:.25;animation:luluFloat 14s ease-in-out infinite;background:#8b65ff;left:-12%;top:-18%}.lulu-bg:after{background:#20d8ed;left:auto;right:-14%;top:20%;animation-delay:-6s}@keyframes luluFloat{50%{transform:translate(10vw,6vh) scale(1.15)}}.card,.drop,.panel,.historyList{transition:transform .45s ease,opacity .45s ease,box-shadow .45s ease}.tab.active{animation:luluTab .45s ease}@keyframes luluTab{50%{transform:translateY(-2px)}}';d.head.appendChild(s)}if(!d.getElementById('lulu-bg')){const x=d.createElement('div');x.id='lulu-bg';x.className='lulu-bg';d.body.prepend(x)}let old=d.getElementById('lulu-vip-overlay');if(old)old.remove();let q=d.createElement('button');q.id='lulu-vip-overlay';q.textContent=vip?'✦ VIP actif':'✦ VIP';q.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:2147483647;padding:12px 24px;border-radius:15px;border:1px solid #8060c7;background:linear-gradient(135deg,#21143fee,#101a28ee);color:#fff;font:900 13px system-ui;cursor:pointer;box-shadow:0 12px 40px #0009';q.onclick=open;d.body.appendChild(q);if(vip)activate()}catch(x){}}function activate(){try{const d=f.contentDocument;if(!d)return;const q=d.getElementById('quality');if(q){q.value=100;q.dispatchEvent(new Event('input',{bubbles:true}))}vb.textContent='✦ VIP actif';vb.classList.add('on');const q2=d.getElementById('lulu-vip-overlay');if(q2){q2.textContent='✦ VIP actif';q2.style.background='linear-gradient(100deg,#9b7cff,#63e6ff)';q2.style.color='#08090d'}}catch(x){}}vb.onclick=open;document.getElementById('close').onclick=close;m.onclick=x=>{if(x.target===m)close()};document.getElementById('unlock').onclick=()=>{if(c.value.trim()!=='luluclc3'){e.textContent='Code incorrect.';return}vip=true;try{sessionStorage.setItem('luluclc3_vip','1')}catch(x){}inject();activate();close()};c.onkeydown=x=>{if(x.key==='Enter')document.get
