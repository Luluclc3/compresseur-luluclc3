<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Luluclc3 File Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;font-family:system-ui,sans-serif}.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,#30205b,transparent 32%),radial-gradient(circle at 85% 25%,#063f4d,transparent 30%),#05060a}.orb{position:absolute;width:38vw;height:38vw;border-radius:50%;filter:blur(70px);opacity:.3;animation:float 16s ease-in-out infinite}.o1{background:#8c62ff;left:-10%;top:-15%}.o2{background:#26d8ee;right:-12%;top:15%;animation-delay:-5s}@keyframes float{50%{transform:translate(8vw,5vh) scale(1.15)}}.frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:5;background:transparent;opacity:0;transition:opacity .35s}.frame.ready{opacity:1}.boot{position:fixed;inset:0;z-index:20;background:#05060a;display:grid;place-items:center;transition:opacity .45s,visibility .45s}.boot.hide{opacity:0;visibility:hidden;pointer-events:none}.bootbox{text-align:center;width:min(390px,90vw)}.logo{width:78px;height:78px;margin:auto;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#9b7cff,#63e6ff);font-size:32px;font-weight:900}.boot h2{color:#fff;margin:20px 0 7px}.boot p{color:#8e96a5;font-size:12px}.bootbar{width:260px;height:4px;background:#151923;margin:18px auto;overflow:hidden;border-radius:99px}.bootbar i{display:block;width:30%;height:100%;background:linear-gradient(90deg,#9b7cff,#63e6ff);animation:load 1.2s ease-in-out infinite}@keyframes load{50%{width:100%}}.retry{display:none;margin-top:14px;padding:10px 14px;border:1px solid #363d4c;background:#11151e;color:#fff;border-radius:10px;font-weight:800;cursor:pointer}.failed .retry{display:inline-block}.failed .bootbar{display:none}.failed p{color:#ff9baa}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>
<div class="boot" id="boot"><div class="bootbox"><div class="logo">L</div><h2>Luluclc3 File Studio</h2><p id="bootText">Ouverture du Studio…</p><div class="bootbar"><i></i></div><button class="retry" id="retry">Réessayer</button></div></div>
<iframe id="studio" class="frame" src="studio-fixed.html" title="Luluclc3 File Studio"></iframe>
<script>
'use strict';
const frame=document.getElementById('studio'),boot=document.getElementById('boot'),text=document.getElementById('bootText'),retry=document.getElementById('retry');let timer;
function start(){boot.classList.remove('hide','failed');text.textContent='Ouverture du Studio…';frame.classList.remove('ready');clearTimeout(timer);timer=setTimeout(()=>{boot.classList.add('failed');text.textContent='Le Studio met trop de temps à démarrer. Vérifie ta connexion puis réessaie.'},9000)}
frame.addEventListener('load',()=>{clearTimeout(timer);frame.classList.add('ready');setTimeout(()=>boot.classList.add('hide'),180)},{once:false});retry.onclick=()=>{frame.src='studio-fixed.html?reload='+Date.now();start()};start();
</script>
</body>
</html>
