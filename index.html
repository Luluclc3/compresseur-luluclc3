<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luluclc3 File Studio</title><style>
html,body{margin:0;width:100%;height:100%;background:#07080d;overflow:hidden;font-family:system-ui,sans-serif}.frame{position:fixed;inset:0;border:0;width:100%;height:100%;opacity:0;transition:opacity .9s ease;z-index:1}.frame.ready{opacity:1}.vip{position:fixed!important;left:50%!important;right:auto!important;top:18px!important;transform:translateX(-50%)!important;z-index:2147483647!important;border:1px solid #7659b5;background:linear-gradient(135deg,#21143f,#111925);color:#f0e9ff;border-radius:14px;padding:12px 22px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 12px 35px #0009;transition:.3s;display:block!important}.vip:hover{transform:translateX(-50%) translateY(-2px) scale(1.03)!important}.vip.on{background:linear-gradient(100deg,#9b7cff,#63e6ff);color:#08090d;border-color:transparent}.modal{position:fixed;inset:0;z-index:2147483646;background:#000c;backdrop-filter:blur(16px);display:grid;place-items:center;padding:18px;opacity:0;visibility:hidden;transition:.35s}.modal.open{opacity:1;visibility:visible}.box{position:relative;width:min(450px,100%);background:#11141d;border:1px solid #654c99;border-radius:25px;padding:30px;box-shadow:0 35px 100px #000;transform:translateY(20px) scale(.97);transition:.35s}.modal.open .box{transform:none}.eyebrow{font-size:10px;letter-spacing:.16em;color:#a18bd3;font-weight:900}.box h2{margin:8px 0;font-size:29px}.box p{color:#949bab;font-size:12px;line-height:1.7}.box label{display:block;color:#bfc4ce;font-size:11px;margin:18px 0 7px}.box input{width:100%;box-sizing:border-box;background:#090b10;color:#fff;border:1px solid #3a4050;border-radius:11px;padding:13px;outline:0}.unlock{width:100%;margin-top:11px;border:0;border-radius:12px;padding:14px;font-weight:900;background:linear-gradient(100deg,#9b7cff,#63e6ff);color:#08090d;cursor:pointer}.close{position:absolute;right:18px;top:10px;background:none;border:0;color:#9097a5;font-size:28px;cursor:pointer}.err{min-height:16px;color:#ff7d91;text-align:center;font-size:10px;margin-top:8px}.viptools{margin-top:18px;padding-top:18px;border-top:1px solid #292e3a}.viptools h3{margin:0 0 10px;font-size:13px}.viptools .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{background:#090b10;border:1px solid #292e3a;color:#cdd2dc;border-radius:11px;padding:11px;font-size:11px}.hint{font-size:9px;color:#707787;margin-top:9px;line-height:1.5}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:2147483647;background:#111722;border:1px solid #343c4c;color:#eef2f8;border-radius:14px;padding:12px 18px;font-size:11px;opacity:0;transition:.35s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.vip{top:10px!important}.box{padding:25px}}
</style></head><body>
<iframe id="studio" class="frame" src="studio-fixed.html" title="Luluclc3 File Studio"></iframe><button id="vipBtn" class="vip" type="button">✦ VIP</button><div id="toast" class="toast">Mode modifié</div>
<div id="modal" class="modal" aria-hidden="true"><div class="box" role="dialog" aria-modal="true"><button id="close" class="close" type="button">×</button><div class="eyebrow">ACCÈS VIP</div><h2>Ultra, contrôle total.</h2><p>Déverrouille les réglages Ultra, la taille cible et les options avancées.</p><label for="code">Code VIP</label><input id="code" type="password" autocomplete="off" placeholder="Entre ton code VIP"><button id="unlock" class="unlock" type="button">Activer le VIP ✦</button><div id="err" class="err"></div><div class="viptools"><h3>Réglages VIP</h3><div class="row"><div class="tool">⚡ Ultra · qualité 100 %</div><div class="tool">🎯 Taille cible</div><div class="tool">🎬 Réglages média</div><div class="tool">📦 Traitement par lot</div></div><div class="hint">Activation locale pour cette session.</div></div></div></div>
<script>'use strict';const frame=document.getElementById('studio'),vipBtn=document.getElementById('vipBtn'),modal=document.getElementById('modal'),closeBtn=document.getElementById('close'),code=document.getElementById('code'),unlock=document.getElementById('unlock'),err=document.getElementById('err'),toast=document.getElementById('toast');let vip=false;try{vip=sessionStorage.getItem('luluclc3_vip')==='1'}catch(e){}function openVip(){modal.classList.add('open');modal.setAttribute('aria-hidden','false');err.textContent='';setTimeout(()=>code.focus(),100)}function closeVip(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),1800)}vipBtn.onclick=openVip;closeBtn.onclick=closeVip;modal.onclick=e=>{if(e.target===modal)closeVip()};function inject(){try{const d=frame.contentDocument;if(!d?.body||!d.head)return;frame.classList.add('ready');let st=d.getElementById('lulu-vip-overlay-style');if(!st){st=d.createElement('style');st.id='lulu-vip-overlay-style';st.textContent='.lulu-vip-float{position:fixed!important;left:50%!important;right:auto!important;top:18px!important;transform:translateX(-50%)!important;z-index:2147483647!important;display:block!important;padding:12px 22px!important;border:1px solid #7659b5!important;border-radius:14px!important;background:linear-gradient(135deg,#21143f,#111925)!important;color:#f0e9ff!important;font:900 13px system-ui,sans-serif!important;box-shadow:0 12px 35px #0009!important;cursor:pointer!important;transition:.3s!important}.lulu-vip-float:hover{transform:translateX(-50%) translateY(-2px) scale(1.03)!important}.lulu-vip-float.on{background:linear-gradient(100deg,#9b7cff,#63e6ff)!important;color:#08090d!important}';d.head.appendChild(st)}let b=d.getElementById('lulu-vip-overlay');if(!b){b=d.createElement('button');b.id='lulu-vip-overlay';b.className='lulu-vip-float';b.type='button';b.onclick=openVip;d.body.appendChild(b)}b.textContent=vip?'✦ VIP actif':'✦ VIP';if(vip)b.classList.add('on');else b.classList.remove('on');if(vip)activate()}catch(e){}}function activate(){try{const d=frame.contentDocument;if(!d?.body)return;d.body.classList.add('vip-active');const q=d.getElementById('quality');if(q){q.value=100;q.dispatchEvent(new Event('input',{bubbles:true}))}const b=d.getElementById('lulu-vip-overlay');if(b){b.textContent='✦ VIP actif';b.classList.add('on')}vipBtn.textContent='✦ VIP actif';vipBtn.classList.add('on')}catch(e){}}frame.onload=inject;setTimeout(()=>{frame.classList.add('ready');inject()},1800);if(vip){vipBtn.textContent='✦ VIP actif';vipBtn.classList.add('on')}unlock.onclick=()=>{if(code.value.trim()!=='luluclc3'){err.textContent='Code incorrect.';return}vip=true;try{sessionStorage.setItem('luluclc3_vip','1')}catch(e){}inject();activate();closeVip();toastMsg('✦ VIP activé')};code.onkeydown=e=>{if(e.key==='Enter')unlock.click()};window.onkeydown=e=>{if(e.key==='Escape')closeVip()};</script></body></html>
