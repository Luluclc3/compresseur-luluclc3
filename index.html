<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luluclc3 File Studio</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07080d;overflow:hidden;font-family:system-ui,sans-serif}
.frame{position:fixed;inset:0;border:0;width:100%;height:100%;opacity:0;transition:opacity .7s ease}.frame.ready{opacity:1}
.vip{position:fixed;right:18px;top:14px;z-index:9999;border:1px solid #7659b5;background:linear-gradient(135deg,#21143f,#111925);color:#f0e9ff;border-radius:14px;padding:12px 17px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 12px 35px #0009;transition:.25s}.vip:hover{transform:translateY(-2px) scale(1.02);border-color:#b29aff}.vip.on{background:linear-gradient(100deg,#9b7cff,#63e6ff);color:#08090d;border-color:transparent}
.modal{position:fixed;inset:0;z-index:10000;background:#000c;backdrop-filter:blur(16px);display:grid;place-items:center;padding:18px;opacity:0;visibility:hidden;transition:.35s}.modal.open{opacity:1;visibility:visible}
.box{position:relative;width:min(450px,100%);background:#11141d;border:1px solid #654c99;border-radius:25px;padding:30px;box-shadow:0 35px 100px #000;transform:translateY(20px) scale(.97);transition:.35s}.modal.open .box{transform:none}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#a18bd3;font-weight:900}.box h2{margin:8px 0;font-size:29px}.box p{color:#949bab;font-size:12px;line-height:1.7}.box label{display:block;color:#bfc4ce;font-size:11px;margin:18px 0 7px}.box input{width:100%;box-sizing:border-box;background:#090b10;color:#fff;border:1px solid #3a4050;border-radius:11px;padding:13px;outline:0}.box input:focus{border-color:#9b7cff;box-shadow:0 0 0 3px #9b7cff20}.unlock{width:100%;margin-top:11px;border:0;border-radius:12px;padding:14px;font-weight:900;background:linear-gradient(100deg,#9b7cff,#63e6ff);color:#08090d;cursor:pointer}.close{position:absolute;right:18px;top:10px;background:none;border:0;color:#9097a5;font-size:28px;cursor:pointer}.err{min-height:16px;color:#ff7d91;text-align:center;font-size:10px;margin-top:8px}.viptools{margin-top:18px;padding-top:18px;border-top:1px solid #292e3a}.viptools h3{margin:0 0 10px;font-size:13px}.viptools .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{background:#090b10;border:1px solid #292e3a;color:#cdd2dc;border-radius:11px;padding:11px;font-size:11px}.hint{font-size:9px;color:#707787;margin-top:9px;line-height:1.5}
@media(max-width:600px){.vip{right:10px;top:9px}.box{padding:25px}.viptools .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<iframe id="studio" class="frame" src="studio-fixed.html" title="Luluclc3 File Studio"></iframe>
<button id="vipBtn" class="vip">✦ VIP</button>
<div id="modal" class="modal" aria-hidden="true">
<div class="box" role="dialog" aria-modal="true" aria-label="Accès VIP">
<button id="close" class="close" aria-label="Fermer">×</button>
<div class="eyebrow">ACCÈS VIP</div>
<h2>Ultra, contrôle total.</h2>
<p>Déverrouille les réglages Ultra et la cible de taille avancée pour cette session.</p>
<label for="code">Code VIP</label>
<input id="code" type="password" autocomplete="off" placeholder="Entre ton code VIP">
<button id="unlock" class="unlock">Activer le VIP ✦</button>
<div id="err" class="err"></div>
<div class="viptools"><h3>Réglages VIP disponibles</h3><div class="row"><div class="tool">⚡ Ultra · qualité 100 %</div><div class="tool">🎯 Taille cible</div></div><div class="hint">Le code VIP est vérifié localement pour cette interface et l’activation reste valable pendant la session.</div></div>
</div>
</div>
<script>
'use strict';
const frame=document.getElementById('studio'),vipBtn=document.getElementById('vipBtn'),modal=document.getElementById('modal'),closeBtn=document.getElementById('close'),code=document.getElementById('code'),unlock=document.getElementById('unlock'),err=document.getElementById('err');
let vip=false;try{vip=sessionStorage.getItem('luluclc3_vip')==='1'}catch(e){}
function openVip(){modal.classList.add('open');modal.setAttribute('aria-hidden','false');err.textContent='';code.value='';setTimeout(()=>code.focus(),100)}
function closeVip(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
vipBtn.addEventListener('click',openVip);closeBtn.addEventListener('click',closeVip);modal.addEventListener('click',e=>{if(e.target===modal)closeVip()});
function activateInFrame(){try{const d=frame.contentDocument;if(!d||!d.body)return;d.body.classList.add('vip-active');const q=d.getElementById('quality');if(q){q.value=100;q.dispatchEvent(new Event('input',{bubbles:true}))}const c=d.getElementById('luluVipControls');if(c)c.classList.add('show');vipBtn.textContent='✦ VIP actif';vipBtn.classList.add('on')}catch(e){}}
function inject(){try{const d=frame.contentDocument;if(!d||!d.body)return;frame.classList.add('ready');if(!d.getElementById('lulu-vip-style')){const st=d.createElement('style');st.id='lulu-vip-style';st.textContent='#luluVipControls{display:none;margin-top:12px;border:1px solid #49366f;border-radius:14px;padding:14px;background:linear-gradient(135deg,#151126,#0b151a)}#luluVipControls.show{display:block}.vip-active .box{border-color:#684b9e}';d.head.appendChild(st)}}catch(e){}}
frame.addEventListener('load',()=>{inject();if(vip)activateInFrame()});
if(vip){vipBtn.textContent='✦ VIP actif';vipBtn.classList.add('on')}
unlock.addEventListener('click',()=>{if(code.value.trim()!=='luluclc3'){err.textContent='Code incorrect.';return}vip=true;try{sessionStorage.setItem('luluclc3_vip','1')}catch(e){}activateInFrame();closeVip()});
code.addEventListener('keydown',e=>{if(e.key==='Enter')unlock.click()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeVip()});
setTimeout(()=>{frame.classList.add('ready')},3500);
</script>
</body>
</html>
